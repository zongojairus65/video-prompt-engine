<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video Prompt Engine</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --bg: #0d0d10;
    --panel: #17171c;
    --panel-2: #1f1f26;
    --border: #2a2a33;
    --accent: #7c6cf6;
    --accent-dim: #4d3fa8;
    --text: #e8e8ec;
    --text-dim: #9a9aa5;
    --green: #4caf7d;
    --red: #e5636e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    max-width: 780px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }

  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }

  textarea {
    width: 100%;
    min-height: 90px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    resize: vertical;
    font-family: inherit;
  }

  textarea:focus, select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }

  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
    min-width: 140px;
  }

  button:disabled {
    background: var(--accent-dim);
    cursor: not-allowed;
  }

  button.choice {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-weight: 500;
    flex: none;
    min-width: 0;
    padding: 8px 14px;
  }

  button.choice.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  button.choice.secondary {
    color: var(--text-dim);
  }

  .stages {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px 16px;
  }

  .stage {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    transition: opacity 0.2s ease;
  }

  .stage:last-child { border-bottom: none; }

  .stage.pending { opacity: 0.4; }

  .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .check { color: var(--green); font-weight: 700; }
  .dot { color: var(--text-dim); font-size: 18px; line-height: 0; }

  .error-banner {
    margin-top: 20px;
    background: rgba(229, 99, 110, 0.12);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .result {
    margin-top: 28px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .card h3 {
    margin: 0 0 10px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  pre {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.5;
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .scores {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
  }

  .score {
    background: var(--panel-2);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .score .value {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  .score .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .meta {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: 6px;
  }

  details summary {
    cursor: pointer;
    color: var(--accent);
    font-size: 13px;
    margin-top: 8px;
  }

  .clarify {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }

  .clarify-intro {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }

  .question {
    margin-bottom: 18px;
  }

  .question:last-of-type {
    margin-bottom: 0;
  }

  .question-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .choice-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="number"], input[type="text"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    width: 110px;
  }
</style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useRef } = React;

const STAGES = [
  { key: "cache",      label: "Vérification du cache" },
  { key: "parsing",    label: "Analyse de la scène (IA)" },
  { key: "motion",     label: "Enrichissement du mouvement" },
  { key: "audio",      label: "Enrichissement audio" },
  { key: "compiling",  label: "Compilation du prompt technique" },
  { key: "optimizing", label: "Optimisation du prompt" },
  { key: "generator",  label: "Adaptation au générateur cible" },
  { key: "evaluating", label: "Évaluation de la fidélité" },
];

const GENERATORS = ["generic", "veo", "kling", "runway"];

const FPS_PRESETS = [24, 30, 60];
const ASPECT_PRESETS = [
  { value: "16:9", label: "16:9 (paysage)" },
  { value: "9:16", label: "9:16 (portrait)" },
  { value: "1:1", label: "1:1 (carré)" },
  { value: "21:9", label: "21:9 (cinéma)" },
];
const SPEECH_RATE_PRESETS = [
  { value: 0.7, label: "Lent (0.7x)" },
  { value: 1.0, label: "Normal (1.0x)" },
  { value: 1.3, label: "Rapide (1.3x)" },
];

// Détection déterministe sur le texte brut (pas d'appel IA) : on ne
// pose une question que si le prompt ne mentionne vraiment rien.
function detectMissing(prompt) {
  const fpsPattern = /\b\d{1,3}\s*(fps|images?\s*par\s*seconde|ips)\b/i;
  const aspectPattern = /\b\d{1,2}\s*:\s*\d{1,2}\b/;
  const aspectKeywords = /(cin[ée]mascope|cin[ée]ma large|widescreen|portrait|paysage|format carr[ée]|vertical|horizontal)/i;

  const hasDialogue = /["“”«»].{3,}["“”«»]/.test(prompt);
  const speechRatePattern = /(d[ée]bit|vitesse de (la )?voix|parle (vite|lentement)|voix (rapide|lente)|speech rate|\b\d(\.\d)?x\b)/i;

  return {
    needFps: !fpsPattern.test(prompt),
    needAspect: !aspectPattern.test(prompt) && !aspectKeywords.test(prompt),
    needSpeechRate: hasDialogue && !speechRatePattern.test(prompt),
  };
}

function StageIcon({ status }) {
  if (status === "done") return <span className="icon check">✓</span>;
  if (status === "running") return <span className="icon"><span className="spinner"></span></span>;
  return <span className="icon dot">•</span>;
}

function StageList({ stages }) {
  return (
    <div className="stages">
      {STAGES.map(s => (
        <div key={s.key} className={"stage " + (stages[s.key] || "pending")}>
          <StageIcon status={stages[s.key] || "pending"} />
          <span>{s.label}</span>
        </div>
      ))}
    </div>
  );
}

function ScoreCard({ evaluation }) {
  return (
    <div className="card">
      <h3>Évaluation</h3>
      <div className="scores">
        <div className="score">
          <div className="value">{evaluation.fidelity}</div>
          <div className="label">Fidélité globale</div>
        </div>
        <div className="score">
          <div className="value">{evaluation.fidelity_lexical}</div>
          <div className="label">Fidélité lexicale</div>
        </div>
        <div className="score">
          <div className="value">{evaluation.fidelity_semantic}</div>
          <div className="label">Fidélité sémantique</div>
        </div>
        <div className="score">
          <div className="value">{evaluation.quality}</div>
          <div className="label">Qualité</div>
        </div>
      </div>
    </div>
  );
}

function Result({ result }) {
  return (
    <div className="result">
      <div className="card">
        <h3>Prompt technique</h3>
        <pre>{result.technical_prompt}</pre>
      </div>

      <div className="card">
        <h3>Prompt optimisé</h3>
        <pre>{result.optimized_prompt}</pre>
      </div>

      <div className="card">
        <h3>Prompt pour {result.generator}</h3>
        <pre>{result.generator_prompt}</pre>
      </div>

      <ScoreCard evaluation={result.evaluation} />

      <div className="card">
        <h3>Scène structurée</h3>
        <details>
          <summary>Voir le JSON complet</summary>
          <pre>{JSON.stringify(result.scene, null, 2)}</pre>
        </details>
        <div className="meta">
          request_id: {result.request_id} · {result.duration_seconds}s
          {result.cached ? " · depuis le cache" : ""}
        </div>
      </div>
    </div>
  );
}

function ChoiceQuestion({ label, presets, value, onSelect, otherValue, onOtherChange, otherType, otherPlaceholder, otherMin, otherMax, otherStep }) {
  const isOther = value === "__other__";
  const isUnknown = value === null;

  return (
    <div className="question">
      <div className="question-label">{label}</div>
      <div className="choice-row">
        {presets.map(p => (
          <button
            key={p.value}
            type="button"
            className={"choice" + (value === p.value ? " selected" : "")}
            onClick={() => onSelect(p.value)}
          >
            {p.label}
          </button>
        ))}

        <button
          type="button"
          className={"choice" + (isOther ? " selected" : "")}
          onClick={() => onSelect("__other__")}
        >
          Autre
        </button>

        {isOther && (
          <input
            type={otherType}
            inputMode={otherType === "number" ? "numeric" : "text"}
            placeholder={otherPlaceholder}
            value={otherValue}
            min={otherMin}
            max={otherMax}
            step={otherStep}
            onChange={e => onOtherChange(e.target.value)}
          />
        )}

        <button
          type="button"
          className={"choice secondary" + (isUnknown ? " selected" : "")}
          onClick={() => onSelect(null)}
        >
          Je ne sais pas
        </button>
      </div>
    </div>
  );
}

function App() {
  const [prompt, setPrompt] = useState("");
  const [generator, setGenerator] = useState("generic");
  const [stages, setStages] = useState({});
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [isGenerating, setIsGenerating] = useState(false);
  const esRef = useRef(null);

  const [needClarify, setNeedClarify] = useState(null);
  const [fpsChoice, setFpsChoice] = useState(null);
  const [fpsOther, setFpsOther] = useState("");
  const [aspectChoice, setAspectChoice] = useState(null);
  const [aspectOther, setAspectOther] = useState("");
  const [speedChoice, setSpeedChoice] = useState(null);
  const [speedOther, setSpeedOther] = useState("");

  function markRemainingDone(fromIndex) {
    setStages(prev => {
      const next = { ...prev };
      for (let i = fromIndex; i < STAGES.length; i++) {
        next[STAGES[i].key] = "done";
      }
      return next;
    });
  }

  function resolvedFps() {
    if (fpsChoice === "__other__") {
      const n = parseInt(fpsOther, 10);
      return Number.isFinite(n) && n > 0 ? n : null;
    }
    return fpsChoice;
  }

  function resolvedAspect() {
    if (aspectChoice === "__other__") {
      const trimmed = aspectOther.trim();
      return trimmed.length > 0 ? trimmed : null;
    }
    return aspectChoice;
  }

  function resolvedSpeed() {
    if (speedChoice === "__other__") {
      const n = parseFloat(speedOther);
      return Number.isFinite(n) && n > 0 ? n : null;
    }
    return speedChoice;
  }

  function startGeneration(fpsOverride, aspectOverride, speedOverride) {
    if (esRef.current) {
      esRef.current.close();
    }

    setStages({});
    setResult(null);
    setError(null);
    setIsGenerating(true);
    setNeedClarify(null);

    let url = "/generate/stream?prompt=" + encodeURIComponent(prompt) +
              "&generator=" + encodeURIComponent(generator);

    if (fpsOverride !== null && fpsOverride !== undefined) {
      url += "&fps=" + encodeURIComponent(fpsOverride);
    }

    if (aspectOverride) {
      url += "&aspect_ratio=" + encodeURIComponent(aspectOverride);
    }

    if (speedOverride !== null && speedOverride !== undefined) {
      url += "&voice_speed=" + encodeURIComponent(speedOverride);
    }

    const es = new EventSource(url);
    esRef.current = es;

    es.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.stage === "complete") {
        setResult(data.result);
        setIsGenerating(false);
        es.close();
        return;
      }

      if (data.stage === "error") {
        setError(data.detail);
        setIsGenerating(false);
        es.close();
        return;
      }

      setStages(prev => ({ ...prev, [data.stage]: data.status }));

      if (data.stage === "cache" && data.status === "done" && data.detail === "hit") {
        markRemainingDone(1);
      }
    };

    es.onerror = () => {
      setError("Connexion au serveur interrompue.");
      setIsGenerating(false);
      es.close();
    };
  }

  function handleSubmit(e) {
    e.preventDefault();

    if (!prompt.trim() || isGenerating) return;

    const missing = detectMissing(prompt);

    if (missing.needFps || missing.needAspect || missing.needSpeechRate) {
      setFpsChoice(null);
      setFpsOther("");
      setAspectChoice(null);
      setAspectOther("");
      setSpeedChoice(null);
      setSpeedOther("");
      setResult(null);
      setError(null);
      setNeedClarify(missing);
      return;
    }

    startGeneration(null, null, null);
  }

  function handleClarifyContinue() {
    startGeneration(resolvedFps(), resolvedAspect(), resolvedSpeed());
  }

  return (
    <div className="app">
      <h1>Video Prompt Engine</h1>
      <div className="subtitle">Transforme une instruction en prompt vidéo technique, étape par étape.</div>

      <form onSubmit={handleSubmit}>
        <textarea
          value={prompt}
          onChange={e => setPrompt(e.target.value)}
          placeholder="Ex: Un homme marche lentement vers la caméra dans une rue de nuit, plan large, pluie légère"
        />
        <div className="row">
          <select value={generator} onChange={e => setGenerator(e.target.value)}>
            {GENERATORS.map(g => <option key={g} value={g}>{g}</option>)}
          </select>
          <button type="submit" disabled={isGenerating}>
            {isGenerating ? "Génération en cours…" : "Générer"}
          </button>
        </div>
      </form>

      {needClarify && (
        <div className="clarify">
          <div className="clarify-intro">
            Quelques paramètres techniques essentiels ne sont pas précisés
            dans ton prompt. Choisis une valeur, ou "Je ne sais pas" pour
            laisser le système appliquer une valeur par défaut adaptée.
          </div>

          {needClarify.needFps && (
            <ChoiceQuestion
              label="Images par seconde (fps)"
              presets={FPS_PRESETS.map(v => ({ value: v, label: v + " fps" }))}
              value={fpsChoice}
              onSelect={setFpsChoice}
              otherValue={fpsOther}
              onOtherChange={setFpsOther}
              otherType="number"
              otherPlaceholder="ex: 48"
              otherMin="1"
              otherMax="240"
              otherStep="1"
            />
          )}

          {needClarify.needAspect && (
            <ChoiceQuestion
              label="Format / ratio d'image"
              presets={ASPECT_PRESETS}
              value={aspectChoice}
              onSelect={setAspectChoice}
              otherValue={aspectOther}
              onOtherChange={setAspectOther}
              otherType="text"
              otherPlaceholder="ex: 4:3"
            />
          )}

          {needClarify.needSpeechRate && (
            <ChoiceQuestion
              label="Vitesse de parole des dialogues"
              presets={SPEECH_RATE_PRESETS}
              value={speedChoice}
              onSelect={setSpeedChoice}
              otherValue={speedOther}
              onOtherChange={setSpeedOther}
              otherType="number"
              otherPlaceholder="ex: 1.5"
              otherMin="0.1"
              otherMax="4"
              otherStep="0.1"
            />
          )}

          <div className="row">
            <button type="button" onClick={handleClarifyContinue}>
              Continuer la génération
            </button>
          </div>
        </div>
      )}

      {(isGenerating || Object.keys(stages).length > 0) && !error && !needClarify &&
        <StageList stages={stages} />
      }

      {error && <div className="error-banner">{error}</div>}

      {result && !needClarify && <Result result={result} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
